name: CI

on:
  pull_request:
    branches: [dev1, master]
  push:
    branches: [dev1, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  api-quality:
    name: API Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://catchup_ci:catchup_ci_password@localhost:5432/catchup_ci_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      WEB_ORIGIN: http://localhost:3000
      TRUST_PROXY_HOPS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.build.json
      - name: Unit tests with coverage
        run: npm run test:cov -- --runInBand
      - name: Seed tests
        run: npm run test:seed
      - name: Production build
        run: npm run build

  web-quality:
    name: Web Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  postgres-e2e:
    name: PostgreSQL E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://catchup_ci:catchup_ci_password@localhost:5432/catchup_ci_test?schema=public
      CATCHUP_TEST_DATABASE_URL: postgresql://catchup_ci:catchup_ci_password@localhost:5432/catchup_ci_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      WEB_ORIGIN: http://localhost:3000
      TRUST_PROXY_HOPS: 0
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: catchup_ci_test
          POSTGRES_USER: catchup_ci
          POSTGRES_PASSWORD: catchup_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catchup_ci -d catchup_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Deploy migrations to clean database
        run: npm run test:e2e:setup
      - name: PostgreSQL integration and E2E tests
        run: npm run test:e2e

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API production dependencies
        working-directory: apps/api
        run: npm ci --omit=dev
      - name: Audit API production dependencies
        working-directory: apps/api
        run: npm audit --omit=dev
      - name: Install Web production dependencies
        working-directory: apps/web
        run: npm ci --omit=dev
      - name: Audit Web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev

  docker-production:
    name: Docker Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API runtime image
        run: docker build --target runtime --tag catchup-api:ci apps/api
      - name: Build API migration image
        run: docker build --target migrate --tag catchup-api-migrate:ci apps/api
      - name: Build Web runtime image
        run: docker build --target runtime --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 --tag catchup-web:ci apps/web
      - name: Verify non-root runtime users
        run: |
          test "$(docker image inspect catchup-api:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect catchup-api-migrate:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect catchup-web:ci --format '{{.Config.User}}')" = "node"
      - name: Start clean PostgreSQL container
        run: |
          docker network create catchup-ci
          docker run --detach --name catchup-postgres --network catchup-ci \
            --env POSTGRES_DB=catchup_ci_test \
            --env POSTGRES_USER=catchup_ci \
            --env POSTGRES_PASSWORD=catchup_ci_password \
            --health-cmd "pg_isready -U catchup_ci -d catchup_ci_test" \
            --health-interval 2s --health-timeout 2s --health-retries 30 \
            postgres:16-alpine
          for attempt in {1..30}; do
            [ "$(docker inspect catchup-postgres --format '{{.State.Health.Status}}')" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs catchup-postgres
          exit 1
      - name: Run migration image
        run: |
          docker run --rm --network catchup-ci \
            --env DATABASE_URL=postgresql://catchup_ci:catchup_ci_password@catchup-postgres:5432/catchup_ci_test?schema=public \
            catchup-api-migrate:ci
      - name: Verify API health and readiness
        run: |
          docker run --detach --name catchup-api --network catchup-ci --publish 3001:3001 \
            --env DATABASE_URL=postgresql://catchup_ci:catchup_ci_password@catchup-postgres:5432/catchup_ci_test?schema=public \
            --env JWT_SECRET=ci-only-jwt-secret-with-at-least-32-characters \
            --env WEB_ORIGIN=http://localhost:3000 \
            --env TRUST_PROXY_HOPS=0 \
            catchup-api:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/health/live >/dev/null \
              && curl --fail --silent http://localhost:3001/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs catchup-api
          exit 1
      - name: Verify Web health
        run: |
          docker run --detach --name catchup-web --publish 3000:3000 \
            --env NEXTAUTH_URL=http://localhost:3000 \
            --env NEXTAUTH_SECRET=ci-only-nextauth-secret-with-at-least-32-characters \
            catchup-web:ci
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:3000/api/health >/dev/null && exit 0
            sleep 2
          done
          docker logs catchup-web
          exit 1
      - name: Verify degraded API readiness
        run: |
          docker stop catchup-postgres
          for attempt in {1..15}; do
            live_code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3001/health/live || true)"
            ready_code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3001/health/ready || true)"
            [ "$live_code" = "200" ] && [ "$ready_code" = "503" ] && exit 0
            sleep 2
          done
          docker logs catchup-api
          echo "Expected live=200 and ready=503; got live=$live_code ready=$ready_code"
          exit 1
