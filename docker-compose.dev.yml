services:
  postgres:
    image: postgres:16-alpine
    container_name: catchup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${CATCHUP_POSTGRES_DB:?Set CATCHUP_POSTGRES_DB in .env}"
      POSTGRES_USER: "${CATCHUP_POSTGRES_USER:?Set CATCHUP_POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${CATCHUP_POSTGRES_PASSWORD:?Set CATCHUP_POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20

  postgres-test:
    image: postgres:16-alpine
    container_name: catchup-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: catchup_test
      POSTGRES_USER: catchup_test
      POSTGRES_PASSWORD: catchup_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catchup_test -d catchup_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4
    container_name: catchup-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: "${CATCHUP_PGADMIN_EMAIL:?Set CATCHUP_PGADMIN_EMAIL in .env}"
      PGADMIN_DEFAULT_PASSWORD: "${CATCHUP_PGADMIN_PASSWORD:?Set CATCHUP_PGADMIN_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
